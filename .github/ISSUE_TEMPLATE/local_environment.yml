name: ローカル環境
description: ローカル環境のセットアップや設定に関する問題
title: "[Local] "
labels: ["type: local-environment"]
body:
  - type: markdown
    attributes:
      value: |
        ローカル環境のセットアップや設定に関する問題報告用テンプレートです。

  - type: dropdown
    id: category
    attributes:
      label: カテゴリ
      description: どのような種類の問題ですか？
      options:
        - セットアップ・初期構築
        - 依存関係・パッケージ
        - Docker・コンテナ
        - データベース設定
        - ビルド・起動エラー
        - 開発ツール設定
        - その他
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 対象領域
      description: どの領域に関する問題ですか？
      options:
        - バックエンド
        - フロントエンド
        - データベース
        - インフラ
        - 全体
      multiple: true
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 優先度
      description: この問題の優先度は？
      options:
        - Critical（開発がブロックされている）
        - High（高）
        - Medium（中）
        - Low（低）
    validations:
      required: true

  - type: textarea
    id: problem_description
    attributes:
      label: 問題の説明
      description: 発生している問題を具体的に説明してください
      placeholder: |
        例：バックエンドのDockerコンテナが起動時にデータベース接続エラーで停止する
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: 再現手順
      description: 問題を再現するための手順
      placeholder: |
        1. リポジトリをクローン
        2. `docker-compose up -d` を実行
        3. `make dev` でバックエンドを起動
        4. エラーメッセージが表示される
    validations:
      required: true

  - type: textarea
    id: error_message
    attributes:
      label: エラーメッセージ・ログ
      description: 関連するエラーメッセージやログを記載してください
      render: shell
      placeholder: |
        Error: failed to connect to database: connection refused
        make: *** [dev] Error 1
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 環境情報
      description: ローカル環境の詳細情報
      placeholder: |
        - OS: macOS 14.0 / Windows 11 / Ubuntu 22.04
        - Go: 1.26.0
        - Node.js: 20.11.0
        - Docker: 24.0.0
        - Docker Compose: 2.23.0
        - エディタ: VS Code 1.85.0
    validations:
      required: true

  - type: textarea
    id: current_status
    attributes:
      label: 現在の状態
      description: どこまで進んでいて、何ができていないか
      placeholder: |
        - フロントエンドは正常に起動している
        - バックエンドの起動時にデータベース接続でエラー
        - マイグレーションは未実施
    validations:
      required: false

  - type: textarea
    id: attempted_solutions
    attributes:
      label: 試したこと
      description: 問題解決のために試したことがあれば記載
      placeholder: |
        - Dockerコンテナの再起動
        - .env.exampleから.envファイルをコピー
        - ポート番号の確認
    validations:
      required: false

  - type: textarea
    id: expected_behavior
    attributes:
      label: 期待される動作
      description: 正常に動作した場合、どうなるべきか
      placeholder: |
        - すべてのDockerコンテナが正常に起動する
        - バックエンドがhttp://localhost:8080で応答する
        - フロントエンドがhttp://localhost:8081で表示される
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 追加情報
      description: スクリーンショット、参考リンクなど
    validations:
      required: false
