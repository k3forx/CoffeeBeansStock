pre-commit:
  parallel: true
  commands:
    backend-lint:
      root: backend/
      glob: "*.go"
      run: bash -c 'printf "%s\n" {staged_files} | xargs -n1 dirname | sort -u | sed "s|^|./|" | xargs golangci-lint run --new-from-rev=HEAD'
    frontend-lint:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: npx eslint {staged_files}
    frontend-typecheck:
      root: frontend/
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
